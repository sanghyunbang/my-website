<text class="title" x="40" y="48">Pawloop 시스템 구성</text>
<text class="s" x="40" y="72">기준: GitHub main b0f89f6 (2026-09-26) · 호스트 이름·계정 정보는 넣지 않았습니다</text>
<text class="s" x="40" y="108">기기</text>
<text class="h" x="60" y="146">Flutter 앱</text>
<text class="b" x="155.796875" y="146">Android(원스토어 배포) · iOS</text>
<text class="s" x="104" y="180">좌표 전송: 정책 한 곳</text>
<text class="s" x="322" y="180">산책 초안 큐 · 재전송</text>
<text class="s" x="527" y="180">채팅 수신 폴링 3→30초</text>
<text class="h" x="796" y="146">네이버 지도 SDK</text>
<text class="b" x="796" y="170">타일·마커를</text>
<text class="b" x="796" y="192">앱이 직접 그림</text>
<text class="s" x="80" y="314">AWS · Terraform envs/prod: EC2·EIP·EBS·SES</text>
<text class="s" x="264" y="350">EC2 1대 · Docker Compose</text>
<text class="s" x="704" y="314">외부 서비스</text>
<text class="h" x="284" y="392">Caddy 2.10 — 유일한 진입점</text>
<text class="b" x="284" y="416">443·80 · TLS 자동 발급 · /actuator는 health만</text>
<text class="s" x="284" y="438">약관·개인정보처리방침 정적 사이트</text>
<text class="h" x="284" y="524">Spring Boot · Java 21</text>
<text class="b" x="284" y="548">모듈러 모놀리스 · 최상위 모듈 22개</text>
<text class="s" x="284" y="656">호스트에는 127.0.0.1:8080만 게시</text>
<text class="s" x="334" y="582" text-anchor="middle">반려·산책</text>
<text class="s" x="442" y="582" text-anchor="middle">가족·일정</text>
<text class="s" x="550" y="582" text-anchor="middle">소통</text>
<text class="s" x="334" y="620" text-anchor="middle">장소</text>
<text class="s" x="442" y="620" text-anchor="middle">계정</text>
<text class="s" x="550" y="620" text-anchor="middle">공통</text>
<text class="h" x="284" y="738">MySQL 8.0 컨테이너</text>
<text class="b" x="284" y="762">데이터는 별도 EBS (prevent_destroy)</text>
<text class="h" x="60" y="524">S3</text>
<text class="b" x="60" y="548">사진·영상</text>
<text class="s" x="60" y="570">영상: HEAD로 확인</text>
<text class="h" x="60" y="632">SES</text>
<text class="b" x="60" y="656">가입·재설정 메일</text>
<text class="h" x="60" y="724">SSM</text>
<text class="b" x="60" y="748">Parameter Store</text>
<text class="s" x="60" y="770">.env · 배포 키</text>
<text class="s" x="60" y="792">부팅 때 받음</text>
<text class="h" x="724" y="356">FCM</text>
<text class="b" x="724" y="380">앱으로 푸시</text>
<text class="s" x="724" y="402">채팅 · 일정 배정</text>
<text class="s" x="724" y="424">커밋 뒤 비동기 발송</text>
<text class="h" x="724" y="478">소셜 로그인</text>
<text class="b" x="724" y="502">카카오 · 구글 · 애플</text>
<text class="s" x="724" y="524">코드 교환은 서버</text>
<text class="s" x="724" y="546">앱엔 60초 1회용 코드</text>
<text class="h" x="724" y="600">공공데이터 API</text>
<text class="s" x="724" y="624">관광공사 · 두루누비</text>
<text class="s" x="724" y="646">인허가 · 기상청 · 에어코리아</text>
<text class="s" x="724" y="668">서버가 대신 호출 · 일일 예산</text>
<text class="h" x="724" y="722">OpenAI · ORS · Slack</text>
<text class="b" x="724" y="746">ORS = OpenRouteService</text>
<text class="s" x="724" y="768">주간 요약 · 코스 · 신고 알림</text>
<text class="s" x="724" y="790">운영 설정 미확인</text>
<text class="h" x="44" y="864">배포(수동)</text>
<text class="b" x="44" y="888">SSH → git pull → compose up --build</text>
<text class="h" x="396" y="864">GitHub Actions CI — 배포는 하지 않음</text>
<text class="b" x="396" y="888">백엔드 테스트·JaCoCo · flutter analyze·test · 문서 드리프트</text>
<text class="hs acc" x="40" y="953">①</text>
<text class="s" x="64" y="952">인터넷 전체에 열린 문은 Caddy(443·80) 하나 — SSH는 지정한 IP만, 앱 포트는 127.0.0.1, DB는 밖에 열지 않음</text>
<text class="hs acc" x="40" y="977">②</text>
<text class="s" x="64" y="976">공공데이터·AI 키는 서버에만 — 앱은 서버를 거쳐 받는다</text>
<text class="hs acc" x="40" y="1001">③</text>
<text class="s" x="64" y="1000">좌표가 기기를 떠나는 자리는 정책 하나(컴파일 타임 상수, 기본 꺼짐)</text>
<text class="s" x="40" y="1026">모든 구성 요소 1인 개발</text>
<text class="s" x="256.0084375" y="1026">코드에 있으나 운영 설정 미확인</text>
<text class="s" x="523.7465625" y="1026">폴링·부팅 시 수신</text>
<text class="s" x="661.98" y="1026">운영 메트릭 수집기는 없음</text>
