<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1046" width="1000" height="1046" role="img" aria-labelledby="t d">
<title id="t">Pawloop 시스템 구성</title>
<desc id="d">Flutter 앱은 HTTPS 443으로 Caddy에 붙고, Caddy가 같은 EC2의 Spring Boot 앱으로 넘긴다. Spring Boot는 같은 EC2의 MySQL 컨테이너(데이터는 별도 EBS), S3, SES, FCM, 소셜 로그인 공급자, 공공데이터 API를 쓴다. 운영 설정은 부팅 때 SSM에서 받는다. CI는 배포하지 않고, 배포는 SSH로 수동이다.</desc>
