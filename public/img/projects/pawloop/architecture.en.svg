<!-- text -->
<text class="title" x="40" y="48">Pawloop system architecture</text>
<text class="s" x="40" y="72">Basis: GitHub main b0f89f6 (2026-09-26) · host names and account details omitted</text>
<text class="s" x="40" y="108">Device</text>
<text class="h" x="60" y="146">Flutter app</text>
<text class="b" x="173.0625" y="146">Android (on ONE store) · iOS</text>
<text class="s" x="104" y="180">Location upload: one policy</text>
<text class="s" x="322" y="180">Walk draft queue · resend</text>
<text class="s" x="527" y="180">Chat polling 3→30 s</text>
<text class="h" x="796" y="146">Naver Map SDK</text>
<text class="b" x="796" y="170">tiles and markers</text>
<text class="b" x="796" y="192">drawn by the app</text>
<text class="s" x="80" y="314">AWS · Terraform envs/prod: EC2, EIP, EBS, SES</text>
<text class="s" x="264" y="350">One EC2 instance · Docker Compose</text>
<text class="s" x="704" y="314">External services</text>
<text class="h" x="284" y="392">Caddy 2.10 — the only entry point</text>
<text class="b" x="284" y="416">443·80 · auto TLS · /actuator: health only</text>
<text class="s" x="284" y="438">static terms &amp; privacy site</text>
<text class="h" x="284" y="524">Spring Boot · Java 21</text>
<text class="b" x="284" y="548">modular monolith · 22 top-level modules</text>
<text class="s" x="284" y="656">published only on 127.0.0.1:8080</text>
<text class="s" x="334" y="582" text-anchor="middle">Walks</text>
<text class="s" x="442" y="582" text-anchor="middle">Family</text>
<text class="s" x="550" y="582" text-anchor="middle">Messaging</text>
<text class="s" x="334" y="620" text-anchor="middle">Places</text>
<text class="s" x="442" y="620" text-anchor="middle">Accounts</text>
<text class="s" x="550" y="620" text-anchor="middle">Common</text>
<text class="h" x="284" y="738">MySQL 8.0 container</text>
<text class="b" x="284" y="762">data on separate EBS (prevent_destroy)</text>
<text class="h" x="60" y="524">S3</text>
<text class="b" x="60" y="548">photos, videos</text>
<text class="s" x="60" y="570">videos: HEAD check</text>
<text class="h" x="60" y="632">SES</text>
<text class="b" x="60" y="656">sign-up, reset mail</text>
<text class="h" x="60" y="724">SSM</text>
<text class="b" x="60" y="748">Parameter Store</text>
<text class="s" x="60" y="770">.env · deploy key</text>
<text class="s" x="60" y="792">fetched at boot</text>
<text class="h" x="724" y="356">FCM</text>
<text class="b" x="724" y="380">push to the app</text>
<text class="s" x="724" y="402">chat · schedule assignment</text>
<text class="s" x="724" y="424">sent async, after commit</text>
<text class="h" x="724" y="478">Social sign-in</text>
<text class="b" x="724" y="502">Kakao · Google · Apple</text>
<text class="s" x="724" y="524">server exchanges the code</text>
<text class="s" x="724" y="546">app gets a 60 s one-time code</text>
<text class="h" x="724" y="600">Public data APIs</text>
<text class="s" x="724" y="624">Korea Tourism Org. · Durunubi</text>
<text class="s" x="724" y="646">licensing · KMA · AirKorea</text>
<text class="s" x="724" y="668">server-side calls · daily budget</text>
<text class="h" x="724" y="722">OpenAI · ORS · Slack</text>
<text class="b" x="724" y="746">ORS = OpenRouteService</text>
<text class="s" x="724" y="768">summary · routes · alerts</text>
<text class="s" x="724" y="790">production config unconfirmed</text>
<text class="h" x="44" y="864">Deploy (manual)</text>
<text class="b" x="44" y="888">SSH → git pull → compose up --build</text>
<text class="h" x="396" y="864">GitHub Actions CI — does not deploy</text>
<text class="b" x="396" y="888">backend tests·JaCoCo · flutter analyze·test · doc drift</text>
<text class="hs acc" x="40" y="953">①</text>
<text class="s" x="64" y="952">The only door open to the whole internet is Caddy (443/80) — SSH from allowed IPs only, app port on 127.0.0.1, DB not exposed</text>
<text class="hs acc" x="40" y="977">②</text>
<text class="s" x="64" y="976">Public-data and AI keys stay on the server — the app goes through it</text>
<text class="hs acc" x="40" y="1001">③</text>
<text class="s" x="64" y="1000">Coordinates can leave the device in one place only (compile-time constant, off by default)</text>
<text class="s" x="40" y="1026">All parts built solo</text>
<text class="s" x="224.2071875" y="1026">in code, production config unconfirmed</text>
<text class="s" x="558.62171875" y="1026">polling / fetched at boot</text>
<text class="s" x="750.06109375" y="1026">no metrics collector</text>
</svg>
