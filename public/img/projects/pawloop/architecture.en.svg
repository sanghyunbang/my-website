<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1046" width="1000" height="1046" role="img" aria-labelledby="t d">
<title id="t">Pawloop system architecture</title>
<desc id="d">The Flutter app connects to Caddy over HTTPS 443, and Caddy forwards to the Spring Boot app on the same EC2 instance. Spring Boot uses a MySQL container on the same instance (data on a separate EBS volume), S3, SES, FCM, social sign-in providers and public-data APIs. Production config is fetched from SSM at boot. CI does not deploy; deploys are manual over SSH.</desc>
