<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 952" width="1000" height="952" role="img" aria-labelledby="t d">
<title id="t">Pawloop 데이터 개요</title>
<desc id="d">Pawloop 데이터 개요. Flyway 기준 38개 표 중 주요 표와 관계를 그렸다. 채팅 묶음(chat_room, chat_room_member, chat_message)은 묶음 밖의 표에 FK 없이 참조로만 붙는다. 방은 origin_kind·origin_ref로 가족 그룹과 크루를, 멤버는 user_id로 사용자를 가리킨다. 산책과 채팅 메시지의 재전송을 멱등하게 만드는 유니크 제약을 금색으로 표시했다.</desc>
