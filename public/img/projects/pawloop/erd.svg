<!-- text -->
<text class="title" x="40" y="48">Pawloop 데이터 개요</text>
<text class="s" x="40" y="72">기준: Flyway V1–V3 (b0f89f6) · 표 38개 중 주요 표 · 실선 = FK, 점선 = FK 없는 참조</text>
<text class="hs" x="36" y="121">device_token</text>
<text class="mono" x="36" y="150">user_id</text>
<text class="s" x="102.8125" y="150">FK 없음</text>
<text class="mono" x="36" y="172">token UK</text>
<text class="mono" x="36" y="194">platform · revoked_at</text>
<text class="hs" x="284" y="121">users</text>
<text class="mono" x="284" y="150">id PK</text>
<text class="mono" x="284" y="172">provider, social_id UK</text>
<text class="mono" x="284" y="194">email UK</text>
<text class="mono" x="284" y="216">nickname</text>
<text class="hs" x="532" y="121">dog</text>
<text class="mono" x="532" y="150">id PK</text>
<text class="mono" x="532" y="172">user_id FK</text>
<text class="mono" x="532" y="194">species · size</text>
<text class="mono" x="532" y="216">deleted_at</text>
<text class="s" x="624.015625" y="216">소프트 삭제</text>
<text class="hs" x="780" y="121">walk</text>
<text class="mono" x="780" y="150">id PK</text>
<text class="mono" x="780" y="172">dog_id FK</text>
<text class="mono" x="780" y="194">distance_m, duration_s</text>
<text class="mono" x="780" y="216">path LINESTRING NULL</text>
<text class="s" x="780" y="238">좌표 미전송 시 NULL</text>
<text class="mono acc" x="780" y="260">UK(dog_id,</text>
<text class="mono acc" x="780" y="282" xml:space="preserve">   client_walk_id)</text>
<text class="hs" x="36" y="353">comment · reaction</text>
<text class="mono" x="36" y="382">post_id FK</text>
<text class="mono" x="36" y="404">reaction UK(post_id,</text>
<text class="mono" x="36" y="426" xml:space="preserve">   user_id, type)</text>
<text class="hs" x="284" y="353">chat_room_member</text>
<text class="mono" x="284" y="382">room_id FK</text>
<text class="mono" x="284" y="404">user_id</text>
<text class="s" x="350.8125" y="404">FK 없음</text>
<text class="mono" x="284" y="426">role · last_read_seq</text>
<text class="s" x="284" y="448">가족·크루 공용 멤버십</text>
<text class="hs" x="532" y="353">care_log</text>
<text class="mono" x="532" y="382">group_id FK</text>
<text class="mono" x="532" y="404">dog_id FK</text>
<text class="mono" x="532" y="426">done_by FK</text>
<text class="mono" x="532" y="448">type · occurred_at</text>
<text class="hs" x="780" y="353">walk_dog</text>
<text class="mono" x="780" y="382">dog_id FK</text>
<text class="mono" x="780" y="404">walk_id FK</text>
<text class="s" x="780" y="426">함께 나간 아이들</text>
<text class="hs" x="36" y="517">post</text>
<text class="mono" x="36" y="546">user_id FK</text>
<text class="mono" x="36" y="568">board</text>
<text class="s" x="86.015625" y="568">5종</text>
<text class="mono" x="36" y="590">dog_id FK</text>
<text class="mono" x="36" y="612">title · body</text>
<text class="hs" x="284" y="517">chat_room</text>
<text class="mono" x="284" y="546">UK(origin_kind,</text>
<text class="mono" x="284" y="568" xml:space="preserve">   origin_ref)</text>
<text class="s" x="284" y="590">origin = FAMILY · CREW</text>
<text class="mono" x="284" y="612">last_seq</text>
<text class="mono" x="284" y="634">last_change_seq</text>
<text class="hs" x="532" y="517">family_group</text>
<text class="mono" x="532" y="546">id PK</text>
<text class="mono" x="532" y="568">name</text>
<text class="s" x="532" y="590">멤버·초대 컬럼 없음</text>
<text class="hs" x="780" y="517">schedule</text>
<text class="mono" x="780" y="546">owner_kind, owner_ref</text>
<text class="s" x="780" y="568">owner = dog · group · room</text>
<text class="mono" x="780" y="590">assignee FK</text>
<text class="mono" x="780" y="612">repeat_kind</text>
<text class="mono" x="780" y="634">version</text>
<text class="s" x="846.8125" y="634">낙관적 잠금</text>
<text class="hs" x="36" y="703">media_objects</text>
<text class="mono" x="36" y="732">media_key</text>
<text class="mono" x="36" y="754">category · status</text>
<text class="mono" x="36" y="776">ref_type, ref_id</text>
<text class="s" x="36" y="798">ref = 글 · 산책 · 채팅</text>
<text class="hs" x="284" y="703">chat_message</text>
<text class="mono" x="284" y="732">room_id FK</text>
<text class="mono" x="284" y="754">UK(room_id, room_seq)</text>
<text class="mono acc" x="284" y="776">UK(room_id,</text>
<text class="mono acc" x="284" y="798" xml:space="preserve">   sender_user_id,</text>
<text class="mono acc" x="284" y="820" xml:space="preserve">   client_msg_id)</text>
<text class="mono" x="284" y="842">deleted_at, change_seq</text>
<text class="hs" x="532" y="703">crew</text>
<text class="mono" x="532" y="732">id PK</text>
<text class="mono" x="532" y="754">neighborhood_code</text>
<text class="mono" x="532" y="776">capacity</text>
<text class="s" x="532" y="798">멤버 표 없음</text>
<text class="s acc" x="318" y="308">chat 모듈 · 경계를 넘는 FK 0</text>
<text class="s" x="782" y="702">장소 캐시 · 관계 없음</text>
<text class="hs" x="790" y="732">place_catalog</text>
<text class="s" x="790" y="794">0.02° 격자</text>
<text class="hs" x="790" y="768">place_cell</text>
<text class="mono" x="790" y="854">PK(day, pool)</text>
<text class="hs" x="790" y="828">kto_call_budget</text>
<text class="s" x="40" y="912">주요 표만 그렸습니다(38개 중). FK 일부는 생략했습니다(예: care_log·schedule·post → users·dog).</text>
<text class="s" x="40" y="934">화살표는 자식 → 부모(N:1) · 금색 = 재전송을 멱등하게 만드는 유니크 제약</text>
</svg>
