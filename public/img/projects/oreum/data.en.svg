<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" role="img" aria-labelledby="t d">
<title id="t">Where the data lives</title>
<desc id="d">A curation post keeps its common fields in the MySQL posts table and its route segments in MongoDB curationSegmentDoc documents, linked by postId in application code (no foreign key). Mountain forecasts live in Redis under weather:{mountainNum} for 12 hours, the 153 mountain points in server memory, and media files in S3 with only their URLs stored. The route and description columns of the original MySQL detail table curation_details moved to MongoDB segment documents on 2025-06-24 to 06-26, and the code stopped using that table. The inset shows the route model: N markers become 2N−1 segments (odd = point, even = path). Main tables only.</desc>
