<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" role="img" aria-labelledby="t d">
<title id="t">데이터를 어디에 두었나</title>
<desc id="d">큐레이션 글의 공통 정보는 MySQL posts 표에, 경로 구간은 MongoDB curationSegmentDoc 문서에 두고 postId로 앱 코드에서 잇는다(FK 없음). 산악 예보는 Redis weather:{mountainNum} 키에 12시간, 산 지점 153곳은 서버 메모리, 미디어 파일은 S3에 두고 URL만 저장한다. 처음의 MySQL 상세 표 curation_details에 있던 경로·설명 컬럼은 2025-06-24~26에 MongoDB 구간 문서로 옮겼고, 그 뒤 코드는 이 표를 쓰지 않는다. 오른쪽 아래 삽도는 마커 N개가 구간 2N−1개(홀수 = 지점, 짝수 = 길)가 되는 경로 구간 모델이다. 주요 표만 그렸다.</desc>
