<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" role="img" aria-labelledby="t d">
<title id="t">OREUM system architecture</title>
<desc id="d">The React web client calls the Spring Boot server over REST and uses the Kakao Maps SDK and VWorld trails (through the CRA dev proxy) directly from the browser. The server fetches KMA API Hub mountain forecasts into Redis, keeps 153 mountain points in memory, posts in MySQL, route segments in MongoDB, media in S3 with CloudFront, and handles Naver/Google OAuth login. Gold marks my part, grey marks teammates, white marks external services and shared storage. Numbers refer to the flows listed below.</desc>
