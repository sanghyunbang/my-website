<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
<title id="t">오름 시스템 구성</title>
<desc id="d">웹 클라이언트(React)가 Spring Boot 서버에 REST로 붙고, 카카오 지도 SDK와 VWorld 등산로(CRA 개발 프록시 경유)를 브라우저에서 직접 쓴다. 서버는 기상청 API허브 산악 예보를 받아 Redis에 두고, 산 지점 153곳은 서버 메모리, 글은 MySQL, 경로 구간은 MongoDB, 미디어는 S3와 CloudFront, 로그인은 네이버·구글 OAuth를 쓴다. 금색은 본인이 맡은 부분, 회색은 팀원이 맡은 부분, 흰색은 외부 서비스와 공용 저장소다. 번호는 아래 목록의 흐름을 가리킨다.</desc>
