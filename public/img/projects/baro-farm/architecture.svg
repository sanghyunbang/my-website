<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">BARO FARM 시스템 구성 — 맡은 경계</title>
  <desc id="d">브라우저 요청이 API Gateway의 인증·인가 필터를 지나 OPA에 질의한 뒤 서비스로 라우팅됩니다. auth-service가 상태 변경을 Kafka의 hotlist 토픽으로 내보내면 opa-bundle이 번들을 다시 만들고, OPA는 폴링으로 그 번들을 가져갑니다. 같은 토픽을 seller-service가 소비해 판매자 상태를 맞춥니다. 금색은 맡은 부분이고, 팀원이 맡은 서비스와 플랫폼은 회색입니다.</desc>
