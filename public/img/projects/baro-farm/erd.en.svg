<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 676" width="1000" height="676" role="img" aria-labelledby="t d">
  <title id="t">Member and auth data</title>
  <desc id="d">Main tables of the member/auth service. users is linked to auth_credential (1:1, email sign-ups only), oauth_account (1:N), refresh_token (1:1, one per user) through user_id columns without JPA associations, and to outbox_event through aggregate_id (the user id as a string); email_verification is not linked to a user. On the right are seller in seller-service, a separate service at the time (1:1 with users, synced by hotlist events), the teammates' farm table, and the OPA bundle data, which is not a table.</desc>
