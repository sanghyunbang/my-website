<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" width="1000" height="668" role="img" aria-labelledby="t d">
  <title id="t">요청 하나가 지나가는 길</title>
  <desc id="d">브라우저가 access_token 쿠키를 실어 보낸 요청은 API Gateway의 Authentication 필터와 OpaAuthorization 필터를 지납니다. 토큰 검증에 실패하면 401이고, 토큰이 없으면 들어온 X-User-* 헤더를 그대로 둔 채 다음 필터로 넘어갑니다. 인가 필터는 OPA에 request·subject·route.service를 보내고, 결과가 true이면 하류 서비스로 라우팅합니다. false나 결과 없음은 403(정책이 기본 거부였던 기간), OPA 오류·2초 초과·서킷 열림·벌크헤드 포화는 503입니다.</desc>
  <style>
    .bg{fill:#f7f4ed}
    .card{fill:#ffffff;stroke:#cdc4b2;stroke-width:1.5}
    .core{fill:#ffffff;stroke:#1f1d1a;stroke-width:2}
    .mine{fill:#fbf1dc;stroke:#9a6b12;stroke-width:2.5}
    .part{fill:#ffffff;stroke:#9a6b12;stroke-width:2}
    .band{fill:#9a6b12}
    .team{fill:#f1ece1;stroke:#cdc4b2;stroke-width:1.5}
    .unk{fill:#ffffff;stroke:#b7ab94;stroke-width:1.5;stroke-dasharray:6 5}
    .y26{fill:#e6f2ef;stroke:#2f7d74;stroke-width:2}
    .dash{fill:none;stroke:#b7ab94;stroke-width:1.5;stroke-dasharray:6 5}
    .chipr{fill:#f1ece1}
    .chipm{fill:#fbf1dc;stroke:#9a6b12;stroke-width:1}
    .chipt{fill:#e6f2ef;stroke:#2f7d74;stroke-width:1}
    .pill{fill:#f7f4ed}
    .title{font:800 24px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1f1d1a}
    .h{font:700 18px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1f1d1a}
    .hs{font:700 16px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1f1d1a}
    .b{font:500 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#5f584b}
    .s{font:500 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#7a7263}
    .mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:#5f584b}
    .acc{fill:#9a6b12}
    .acc2{fill:#2f7d74}
    .ln{stroke:#6b6457;stroke-width:1.8;fill:none}
    .lg{stroke:#9a6b12;stroke-width:2.2;fill:none}
    .ld{stroke:#6b6457;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
    .lgd{stroke:#9a6b12;stroke-width:2;fill:none;stroke-dasharray:6 5}
    .lt{stroke:#2f7d74;stroke-width:2;fill:none}
    .ah{fill:#6b6457}
    .ahg{fill:#9a6b12}
    .aht{fill:#2f7d74}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahg"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="aht"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="668" rx="18"/>
  <text class="title" x="40" y="48">요청 하나가 지나가는 길</text>
  <text class="s" x="40" y="72">기준: 게이트웨이 78eaa987 · 403은 정책이 기본 거부였던 1224e1a2~d4b67d1b(01-22~01-26)</text>
  <rect class="mine" x="579.3" y="37.0" width="22" height="12" rx="3" style="stroke-width:1.5"/>
  <text class="s" x="607.3" y="48">본인 담당</text>
  <rect class="card" x="686.2" y="37.0" width="22" height="12" rx="3"/>
  <text class="s" x="714.2" y="48">응답·하류 서비스</text>
  <path class="ld" d="M838.2 43.0 H860.2" style="stroke-dasharray:4 3"/>
  <text class="s" x="866.2" y="48">토큰 없는 요청</text>
  <rect class="dash" x="262" y="100" width="450" height="360" rx="16"/>
  <text class="s" x="278" y="120">API Gateway · Spring Cloud Gateway</text>
  <rect class="chipm" x="278" y="130" width="418" height="30" rx="14"/>
  <text class="s" x="290" y="150.0">기본 필터: RateLimiter(Redis) · Retry · CircuitBreaker</text>
  <rect class="mine" x="330" y="180" width="340" height="100" rx="12"/>
  <text class="h" x="350" y="210">Authentication 필터</text>
  <text class="b" x="350" y="234">쿠키 → Bearer · HS256 검증</text>
  <text class="s" x="350" y="258">검증되면 X-User-*를 지우고 토큰 값으로 다시 씀</text>
  <rect class="mine" x="330" y="340" width="340" height="100" rx="12"/>
  <text class="h" x="350" y="370">OpaAuthorization 필터</text>
  <text class="b" x="350" y="394">서킷브레이커 · 벌크헤드 · 2초</text>
  <text class="s" x="350" y="418">input: request · subject · route.service</text>
  <path class="lg" d="M430 280 V340" marker-end="url(#g)"/>
  <rect class="pill" x="376.1" y="299.0" width="107.8" height="22" rx="11"/>
  <text class="s" x="430.0" y="315.0" text-anchor="middle">토큰 검증 통과</text>
  <path class="ld" d="M590 280 V340" marker-end="url(#a)"/>
  <rect class="pill" x="543.1" y="299.0" width="93.8" height="22" rx="11"/>
  <text class="s" x="590.0" y="315.0" text-anchor="middle">토큰 없음 ①</text>
  <rect class="card" x="30" y="152" width="192" height="60" rx="12"/>
  <text class="h" x="48" y="177">브라우저</text>
  <text class="s" x="48" y="199">access_token 쿠키</text>
  <path class="ln" d="M222 192 H330" marker-end="url(#a)"/>
  <rect class="pill" x="275.0" y="181.0" width="42.0" height="22" rx="11"/>
  <text class="s" x="296.0" y="197.0" text-anchor="middle">요청</text>
  <rect class="card" x="30" y="228" width="192" height="60" rx="12"/>
  <text class="h" x="48" y="253">401</text>
  <text class="s" x="48" y="275">토큰 검증 실패</text>
  <path class="ln" d="M330 258 H222" marker-end="url(#a)"/>
  <rect class="card" x="30" y="316" width="192" height="84" rx="12"/>
  <text class="h" x="48" y="341">403</text>
  <text class="s" x="48" y="363">false 또는 결과 없음</text>
  <text class="s" x="48" y="385">기본 거부였던 기간만</text>
  <path class="ln" d="M330 360 H222" marker-end="url(#a)"/>
  <rect class="card" x="30" y="412" width="192" height="106" rx="12"/>
  <text class="h" x="48" y="437">503</text>
  <text class="s" x="48" y="459">OPA 오류 · 2초 초과</text>
  <text class="s" x="48" y="481">서킷 열림</text>
  <text class="s" x="48" y="503">벌크헤드 포화</text>
  <path class="ln" d="M330 424 H222" marker-end="url(#a)"/>
  <rect class="mine" x="780" y="316" width="190" height="146" rx="12"/>
  <text class="h" x="800" y="344">OPA (PDP)</text>
  <text class="s" x="800" y="368">data.&lt;service&gt;.&lt;role&gt;</text>
  <text class="s" x="800" y="390">rules_by_id</text>
  <text class="s" x="800" y="412">+ index.method</text>
  <text class="s" x="800" y="434">+ data.hotlist</text>
  <path class="lg" d="M670 366 H780" marker-end="url(#g)"/>
  <rect class="pill" x="725.0" y="355.0" width="42.0" height="22" rx="11"/>
  <text class="s" x="746.0" y="371.0" text-anchor="middle">질의</text>
  <path class="lg" d="M780 412 H670" marker-end="url(#g)"/>
  <rect class="pill" x="719.7" y="401.0" width="52.6" height="22" rx="11"/>
  <text class="s" x="746.0" y="417.0" text-anchor="middle">result</text>
  <rect class="band" x="726" y="112" width="3" height="170" rx="1.5"/>
  <text class="hs" x="738" y="130">access 토큰</text>
  <text class="s" x="738" y="154">HS256 · 유효 7일</text>
  <text class="s" x="738" y="176">sub = email · uid · 역할</text>
  <text class="s" x="738" y="198">user_status · flags</text>
  <text class="s" x="738" y="220">seller_status = 항상 UNKNOWN</text>
  <text class="s" x="738" y="242">HttpOnly · Secure</text>
  <text class="s" x="738" y="264">SameSite=Strict 쿠키</text>
  <path class="lg" d="M500 440 V512" marker-end="url(#g)"/>
  <rect class="pill" x="432.3" y="475.0" width="135.4" height="22" rx="11"/>
  <text class="s" x="500.0" y="491.0" text-anchor="middle">true → lb:// 라우팅</text>
  <rect class="card" x="340" y="512" width="320" height="64" rx="12"/>
  <text class="h" x="360" y="538">하류 서비스</text>
  <text class="s" x="360" y="560">X-User-Id·Role 헤더로 사용자 식별</text>
  <line x1="40" y1="596" x2="960" y2="596" stroke="#cdc4b2" stroke-width="1"/>
  <text class="s" x="40" y="620">① 토큰이 없으면 들어온 X-User-* 헤더를 지우지 않은 채 다음 필터와 하류 서비스로 넘깁니다(한계 표 첫 줄).</text>
  <text class="s" x="40" y="642">기본 필터와 라우트 필터를 합친 실제 실행 순서는 확인하지 않았습니다.</text>
</svg>
