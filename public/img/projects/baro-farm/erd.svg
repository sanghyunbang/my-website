<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 676" width="1000" height="676" role="img" aria-labelledby="t d">
  <title id="t">회원·인증 데이터</title>
  <desc id="d">회원·인증 서비스의 주요 표입니다. users를 중심으로 auth_credential(1:1, 이메일 가입자만), oauth_account(1:N), refresh_token(1:1, 사용자당 1개)이 JPA 연관 없이 user_id 컬럼으로, outbox_event가 aggregate_id(사용자 id 문자열)로 이어지고, email_verification은 사용자와 연결되지 않습니다. 오른쪽은 발표 시점 별도 서비스였던 seller-service의 seller(users와 1:1, hotlist 이벤트로 동기화)와 팀원이 맡은 farm, 그리고 표가 아닌 OPA 번들 데이터입니다.</desc>
