  <text class="title" x="40" y="48">BARO FARM system architecture — my boundary</text>
  <text class="s" x="40" y="72">Basis: final presentation commit 78eaa987 (2026-01-27) · the policy allowed by default from 01-26 (see 'Current state')</text>
