    .s{font:500 13px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#7a7263}
    .mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:#5f584b}
    .acc{fill:#9a6b12}
    .acc2{fill:#2f7d74}
    .ln{stroke:#6b6457;stroke-width:1.8;fill:none}
    .lg{stroke:#9a6b12;stroke-width:2.2;fill:none}
    .ld{stroke:#6b6457;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
