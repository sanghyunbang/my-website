<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">BARO FARM system architecture — my boundary</title>
  <desc id="d">A browser request passes the API Gateway's authentication and authorization filters, which query OPA, and is then routed to a service. auth-service publishes status changes to a Kafka hotlist topic; opa-bundle rebuilds the bundle and OPA pulls it by polling. seller-service consumes the same topic to sync seller status. Gold marks my part; teammates' services and platform are grey.</desc>
