<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 938" width="1000" height="938" role="img" aria-labelledby="t d">
<title id="t">추천 한 번 — LLM이 고르는 것과 Spring이 하는 것</title>
<desc id="d">앱이 감정 값과 목표 키워드를 Spring에 보내면, Spring은 장소 목록 없이 감정 값과 키워드만 Python 추천 서버에 넘깁니다. 추천 서버는 95개 카테고리 닫힌 목록에서 그룹 두 개를 고르게 하고 응답 형식을 검증합니다. Spring은 받은 라벨을 cat3 코드로 바꿔 MySQL에서 후보를 읽고, 자체 점수식으로 순위를 매겨 돌려줍니다.</desc>
