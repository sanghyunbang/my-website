<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 924" width="1000" height="924" role="img" aria-labelledby="t d">
<title id="t">HeatTrip system architecture</title>
<desc id="d">The Flutter app calls the Spring server over REST and calls the Tour API detail endpoint directly for place details. Spring uses MySQL, S3 with CloudFront, the Tour API area list and Kakao Local; recommendations go through the Python recommendation server to OpenAI. OAuth2 providers are wired only on the server; the released app uses email sign-in. Teal marks 2026 solo additions. The deployment strip shows the setup recorded in an operations document on 2026-03-18; when it was first set up is not confirmed.</desc>
