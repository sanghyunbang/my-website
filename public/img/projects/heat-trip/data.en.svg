<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 912" width="1000" height="912" role="img" aria-labelledby="t d">
<title id="t">Place data: collection and model</title>
<desc id="d">The top strip is the order in which place data is collected: the Tour API area list is cleaned and batch-saved to places; from there one branch adds Kakao links and coordinates, and the other builds CAT3 trait snapshots and fills search_text. Below is an overview ERD of the main tables. Place tables are joined by contentid and cat3 without foreign keys; user tables hang off users by foreign keys. Gold is mine, grey is teammates', a gold stripe is partly mine, teal is a 2026 addition.</desc>
