.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:#5f584b}
.acc{fill:#9a6b12}
.acc2{fill:#2f7d74}
.ln{stroke:#6b6457;stroke-width:1.8;fill:none}
