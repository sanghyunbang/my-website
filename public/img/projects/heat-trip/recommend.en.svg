<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 938" width="1000" height="938" role="img" aria-labelledby="t d">
<title id="t">One recommendation — what the LLM picks and what Spring does</title>
<desc id="d">The app sends emotion values and goal keywords to Spring; Spring passes only the emotion values and keywords, with no place list, to the Python recommendation server. The recommendation server has the model pick two groups from a closed list of 95 categories and validates the output format. Spring maps the returned labels to cat3 codes, reads candidates from MySQL and ranks them with its own scoring.</desc>
