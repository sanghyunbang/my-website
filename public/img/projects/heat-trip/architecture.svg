<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 924" width="1000" height="924" role="img" aria-labelledby="t d">
<title id="t">HeatTrip 시스템 구성</title>
<desc id="d">Flutter 앱은 Spring 서버에 REST로 붙고, 장소 상세는 관광공사 API를 직접 부른다. Spring은 MySQL, S3·CloudFront, 관광공사 수집 API, Kakao Local을 쓰고, 추천은 Python 추천 서버를 거쳐 OpenAI에 묻는다. OAuth2 공급자 연동은 서버에만 있고 출시 앱은 이메일 로그인을 쓴다. 청록은 2026년 개인 추가 항목이다. 배포 띠는 2026-03-18 운영 확인 문서에 적힌 구성이고, 처음 구성한 시기는 확인되지 않았다.</desc>
<style>
